services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_DATABASE: ${DB_NAME:-dbtecnoc_db}
      MYSQL_USER: ${DB_USER:-dbtecno_user}
      MYSQL_PASSWORD: ${DB_PASS:-change_me}
    volumes:
      - ./dbtecnoc_db.sql:/docker-entrypoint-initdb.d/dbtecnoc_db.sql:ro

  web:
    image: php:8.2-apache
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dbtecnoc_db}
      DB_USER: ${DB_USER:-dbtecno_user}
      DB_PASS: ${DB_PASS:-change_me}
    volumes:
      - .:/var/www/html
    ports:
      - "8085:80"
    depends_on:
      - db
    command: >
      sh -c "docker-php-ext-install mysqli && apache2-foreground"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8086:80"
    depends_on:
      - db
